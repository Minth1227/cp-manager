<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CP 지정신청 관리 - 자율준수무역거래자</title>
  <meta name="description" content="자율준수무역거래자(CP) AA등급 지정신청을 위한 양식 작성 및 진행 관리 프로그램" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <!-- [수정] html2pdf는 사내망이 외부 CDN을 막는 환경에서 PDF 다운로드가 아예 안 되던 원인이라
       npm 패키지로 번들에 포함시키고 (src/forms/renderer.js에서 import) 이 CDN 태그는 제거함. -->
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" style="display: none;">
      <div class="sidebar-header">
        <div class="logo">
          <span class="material-symbols-rounded">shield_with_house</span>
          <h1>CP Manager</h1>
        </div>
        <p class="subtitle">유형2 · AA등급 목표</p>
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button id="btn-export-all" class="btn-ghost">
          <span class="material-symbols-rounded">download</span> 전체 백업
        </button>
        <button id="btn-import-all" class="btn-ghost">
          <span class="material-symbols-rounded">upload</span> 데이터 복원
        </button>
        <input type="file" id="import-file-input" accept=".json" style="display:none" />
      </div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer"></div>
    <main id="main-content" class="main-content">
      <div id="view-container"></div>
    </main>
  </div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
